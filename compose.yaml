# The compose file a machine runs, with defaults for a single-host install.
# Values local to one machine -- image name, container name, a port already taken -- go in the `compose.override.yaml` beside this file.
# Compose merges that file over this one automatically, and .gitignore keeps it out of the repository.
# One process serves the API, the web client and the scheduled IPv6 DNS check; there is nothing else to start.
# Host networking, not published ports: the DNS check must leave through the host's own IPv6.
# Two consequences: the container's port is the host's port, and `ports:` cannot be used at all.
# Every setting below is described in .env.example.
name: dashboard

services:
  dashboard:
    build:
      context: .
      # Build arguments: what the image is built with, not what the container runs with.
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-dl-cdn.alpinelinux.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        WITH_GIT: ${WITH_GIT:-true}
    image: dashboard:local
    container_name: dashboard
    network_mode: host
    extra_hosts:
      - host.docker.internal:host-gateway
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      # Set here as well so a stray PORT from the host environment cannot reach the container.
      PORT: ${DASHBOARD_PORT:-50014}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      # Both container paths are fixed: the app's DATA_DIR and SCRIPT_ROOT_CONTAINER defaults point at them.
      - ${DATA_DIR_HOST:-./data}:/data
      # A run uploads the script to the target and deletes it there, so no target needs this directory mounted.
      - ${SCRIPT_ROOT_HOST:-./workspace}:/workspace
    # Root for the first instant only: the entrypoint chowns both mounts to PUID:PGID, then drops to it.
    # Starting directly as PUID:PGID cannot work on a fresh clone, where Docker has already created ./data as root.
    user: "0:0"
    # No healthcheck here: the image's own one already builds its URL from PORT.
    logging:
      driver: json-file
      options:
        # json-file has no default cap, and the health check plus streamed run output would grow without bound.
        max-size: "10m"
        max-file: "3"
