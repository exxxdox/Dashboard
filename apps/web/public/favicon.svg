<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Script Dashboard">
  <!-- Solid accent tile rather than a dark glyph: tab strips and bookmark bars
       are mostly light, and a dark-on-dark mark disappears at 16px. The glyph
       is a shell prompt, which is what this app runs. -->
  <rect width="32" height="32" rx="7" fill="#f0a92c" />
  <path d="M9.5 10.5 15 16 9.5 21.5" fill="none" stroke="#1a1204" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M17.5 21.5H23" fill="none" stroke="#1a1204" stroke-width="3.4" stroke-linecap="round" />
</svg>
